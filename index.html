<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>짱깨뽀 오락기</title>

<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Press Start 2P', cursive;
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
}
body{
    background:#000;
    overflow:hidden;
}

/* 공통 화면 */
.screen{
    display:none;
    position:fixed;
    inset:0;
    padding:3vh;
    background:#000;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    z-index:1;
}

/* START 화면 */
#screen-intro{
    background:#000 url("https://raw.githubusercontent.com/flora385/floraa/main/IMG_5204.jpeg") center/cover no-repeat;
    display:flex;
    z-index:9999;
    position:absolute;
}

.start-btn{
    width:65vw;
    padding:5vw 0;
    font-size:6vw;
    background:#6b6b6b;
    border:1vw solid #fff;
    border-radius:3vw;
    color:white;
    text-shadow:0 0 1vw #000;
    animation:introBlink 1.2s infinite;
}
@keyframes introBlink{
    0%{opacity:.6; transform:scale(.97);}
    50%{opacity:1; transform:scale(1.04);}
    100%{opacity:.6; transform:scale(.97);}
}

/* 메뉴 화면 */
#screen-menu .menu-title{
    color:#7ffeff;
    font-size:6vw;
    margin-bottom:5vh;
    text-shadow:0 0 1.5vw #00eaff;
}

/* 버튼 공통 (메뉴 / 충전 둘 다 사용) */
.menu-btn,
.charge-btn{
    width:75vw;
    padding:5vw 0;
    border-radius:4vw;
    margin:2.8vh auto;
    font-size:4.5vw;
    text-align:center;
    cursor:pointer;
    color:white;
    font-weight:600;

    box-shadow:
        0 0 12px rgba(255,255,255,0.4),
        0 0 20px rgba(0,0,0,0.45),
        inset 0 0 10px rgba(255,255,255,0.2);

    border:0.9vw solid rgba(255,255,255,0.8);
    backdrop-filter:blur(2px);
    transition:transform .15s, box-shadow .15s;
}
.menu-btn:active,
.charge-btn:active{
    transform:scale(0.96);
    box-shadow:
        0 0 4px rgba(255,255,255,0.3),
        inset 0 0 10px rgba(0,0,0,0.3);
}

/* 메뉴 버튼별 색 */
.menu-ticket{ 
    background:linear-gradient(180deg,#ffec7d,#ffc938);
}
.menu-rps{ 
    background:linear-gradient(180deg,#ff6b6b,#ff2e2e);
}
.menu-coupon{ 
    background:linear-gradient(180deg,#7ec5ff,#4698ff);
}
.menu-charge{ 
    background:linear-gradient(180deg,#91ff9c,#47d55e);
}

/* 뒤로 버튼 */
.back-global{
    position:absolute;
    top:2vh;
    left:2vh;
    padding:2vw 3vw;
    background:rgba(255,255,255,0.15);
    border:.7vw solid white;
    border-radius:2vw;
    font-size:3vw;
    color:white;
    cursor:pointer;
    z-index:2000;
}
</style>
</head>

<body>

<!-- START 화면 -->
<div id="screen-intro" class="screen">
    <div class="start-btn" id="btnStart">GAME START</div>
</div>

<!-- 메뉴 화면 -->
<div id="screen-menu" class="screen">
    <div class="menu-title">메뉴 선택</div>

    <div class="menu-btn menu-ticket" onclick="goScreen('ticket')">
        🎫 랜덤 티켓 뽑기
    </div>

    <div class="menu-btn menu-rps" onclick="goScreen('rps')">
        ✊ 짱깨뽀 게임
    </div>

    <div class="menu-btn menu-coupon" onclick="goScreen('coupon')">
        🎫 응모권 교환
    </div>

    <div class="menu-btn menu-charge" onclick="goScreen('charge')">
        🔋 엽전 충전센터
    </div>
</div>


<!-- ========================== -->
<!-- 🎟 티켓 뽑기 화면 -->
<!-- ========================== -->

<style>
#screen-ticket{
    background:#000;
    display:none;
}

.ticket-machine{
    position:relative;
    width:88vw;
    max-width:420px;
    height:72vh;
    max-height:520px;
    border-radius:4vw;
    background:linear-gradient(180deg,#262b30,#05070a);
    border:1vw solid #3b3f46;
    box-shadow:
        0 0 2.5vw rgba(0,0,0,0.9),
        inset 0 0 1.8vw rgba(255,255,255,0.06);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:2.5vh 4vw 3vh;
}

/* 상단 타이틀 + 엽전 */
.ticket-header{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:1.5vh;
}
.ticket-title{
    color:#FFE66D;
    font-size:3.8vw;
    text-shadow:0 0 1vw rgba(0,0,0,.9);
}

/* 티켓 화면 엽전 표시 */
.coin-box-ticket{
    background:rgba(0,0,0,.6);
    padding:1vw 2.3vw;
    border-radius:1.3vw;
    border:0.4vw solid #111;
    font-size:3vw;
    color:#F7D93A;
    box-shadow:0 0 1vw rgba(0,0,0,.8);
}

/* 본체 패널 */
.ticket-body{
    position:relative;
    flex:1;
    width:100%;
    margin-top:1vh;
    border-radius:3vw;
    background:
        radial-gradient(circle at 50% 0%, #3c434b 0, #15191f 55%, #040507 100%);
    box-shadow:
        inset 0 0 1.6vw rgba(0,0,0,0.9),
        0 0 1.2vw rgba(0,0,0,0.7);
    overflow:visible;
}

/* 티켓 입구 슬롯 */
.ticket-exit{
    position:absolute;
    top:9%;
    left:50%;
    transform:translateX(-50%);
    width:72%;
    height:6vw;
    max-height:32px;
    background:#151515;
    border-radius:1.6vw;
    border:0.7vw solid #555;
    box-shadow:
        inset 0 0.8vw 1.2vw rgba(0,0,0,1),
        0 0.6vw 1.2vw rgba(0,0,0,0.8);
}

/* 슬롯 위쪽 금속 라인 */
.ticket-exit::before{
    content:"";
    position:absolute;
    left:8%;
    right:8%;
    top:-1.4vw;
    height:0.8vw;
    background:linear-gradient(to right,#888,#eee,#777);
    border-radius:999px;
    opacity:.8;
}

/* 시간 + LED 영역 */
.time-area{
    position:absolute;
    top:4%;
    right:6%;
    width:38%;
    display:none;
    flex-direction:column;
    gap:1.2vw;
}

/* 시간 게이지 */
.time-bar-wrap{
    width:100%;
    height:2.8vw;
    border-radius:1.6vw;
    border:0.45vw solid #fff;
    background:rgba(0,0,0,0.8);
    overflow:hidden;
    box-shadow:0 0 0.8vw rgba(0,0,0,0.8);
}
.time-bar-inner{
    width:100%;
    height:100%;
    background:linear-gradient(to right,#ffeb3b,#ff9800,#ff5722);
    transform-origin:left center;
    transform:scaleX(1);
}

/* LED 텍스트 */
.led-text{
    display:inline-block;
    padding:1vw 1.8vw;
    border-radius:1.8vw;
    border:0.45vw solid #fff;
    background:rgba(255,255,0,0.12);
    color:#fff;
    font-size:3.1vw;
    text-shadow:0 0 1vw #ff0000;
    box-shadow:0 0 1.2vw rgba(0,0,0,0.9);
    animation:ledBlink 0.6s infinite;
}
@keyframes ledBlink{
    0%{opacity:.5; transform:scale(0.97);}
    50%{opacity:1; transform:scale(1.03);}
    100%{opacity:.5; transform:scale(0.97);}
}

/* 종이 */
.long-ticket {
    position:absolute;
    top:14%;
    left:50%;
    transform:translate(-50%, -10%);
    width:24vw;
    max-width:115px;
    background:white;
    border-radius:1vw;
    border:.7vw solid #000;
    display:flex;
    flex-direction:column;
    gap:1vw;
    padding:2.5vw 3vw;
    animation:paperDrop 5s cubic-bezier(.22,.68,.42,1) forwards;
}
@keyframes paperDrop{
    0%   { opacity:0; transform:translate(-50%, -25%) rotate(0deg); }
    18%  { opacity:1; transform:translate(-50%, 0%)  rotate(0.3deg); }
    100% { opacity:1; transform:translate(-50%, 135%) rotate(1deg); }
}

/* 각 줄 */
.ticket-line{
    font-size:3.3vw;
    width:100%;
    padding-bottom:1vw;
    border-bottom:0.5vw dashed #333;
}

/* 3D 연타 버튼 */
.arcade-btn{
    position:absolute;
    right:8%;
    bottom:11%;
    width:30vw;
    height:30vw;
    max-width:140px;
    max-height:140px;
    border-radius:50%;
    background:radial-gradient(circle at 30% 25%, #ffbbbb, #ff5b5b 40%, #b00000 100%);
    border:0.9vw solid #fdfdfd;
    box-shadow:
        0 1.9vw 0 #5a0505,
        0 0 2.4vw rgba(0,0,0,0.9),
        inset 0 0 1.6vw rgba(255,255,255,0.35);
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
    font-size:4.3vw;
    cursor:pointer;
    z-index:30;
    transition:transform .07s, box-shadow .07s;
}
.arcade-btn:active{
    transform:translateY(1vw) scale(.95);
    box-shadow:
        0 0.7vw 0 #5a0505,
        0 0 1.4vw rgba(0,0,0,0.9),
        inset 0 0 1.2vw rgba(255,255,255,0.2);
}

/* 안내 텍스트 */
.tap-guide{
    position:absolute;
    right:9%;
    bottom:6%;
    color:white;
    font-size:3.1vw;
    animation:guideBlink 1.2s infinite;
}
@keyframes guideBlink{
    0%{opacity:.5;}
    50%{opacity:1;}
    100%{opacity:.5;}
}

/* 결과 팝업 */
.result-modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.85);
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    color:white;
    padding:5vw;
    z-index:99999;
}
.result-box{
    background:#000;
    border:.7vw solid white;
    border-radius:3vw;
    padding:5vw;
    width:80vw;
    max-height:70vh;
    overflow:auto;
    font-size:3.5vw;
}
.result-close{
    margin-top:4vh;
    background:white;
    padding:3vw 6vw;
    color:black;
    border-radius:2vw;
    cursor:pointer;
}
</style>

<div id="screen-ticket" class="screen">
    <div class="back-global" onclick="goScreen('menu')">‹ 메뉴</div>

    <div class="ticket-machine">
        <div class="ticket-header">
            <div class="ticket-title">🎟 랜덤 티켓 뽑기</div>
            <div class="coin-box-ticket" id="coinBoxTicket">엽전 : 10개</div>
        </div>

        <div class="ticket-body">
            <div class="ticket-exit"></div>

            <div class="time-area" id="timeArea">
                <div class="time-bar-wrap">
                    <div class="time-bar-inner" id="timeBar"></div>
                </div>
                <div class="led-text">눌러 ! 눌러 !</div>
            </div>

            <div class="tap-guide">👉 여기를 연타!</div>

            <div class="arcade-btn" id="tapBtn">🎟</div>
        </div>
    </div>
</div>

<script>
/* 티켓 출력 로직 */

let tapping = false;
let tapList = [];
let longTicket = null;

let tapGauge = 0;
let lastSpawn = 0;
let tapCountTotal = 0;
let premiumCount = 0;

const SESSION_MS   = 5000;
const MIN_INTERVAL = 300;

const timeArea = document.getElementById("timeArea");
const timeBar  = document.getElementById("timeBar");
let gaugeStartTime = 0;
let gaugeRAF = null;

function startGauge(){
    gaugeStartTime = performance.now();
    timeArea.style.display = "flex";
    timeBar.style.transform = "scaleX(1)";

    const loop = (now) => {
        if (!tapping) {
            timeArea.style.display = "none";
            timeBar.style.transform = "scaleX(0)";
            return;
        }
        const elapsed = now - gaugeStartTime;
        let ratio = Math.max(0, 1 - (elapsed / SESSION_MS));
        timeBar.style.transform = `scaleX(${ratio})`;

        if (ratio > 0){
            gaugeRAF = requestAnimationFrame(loop);
        } else {
            timeArea.style.display = "none";
            timeBar.style.transform = "scaleX(0)";
        }
    };
    gaugeRAF = requestAnimationFrame(loop);
}

function resetTicketSession(){
    if (longTicket) {
        longTicket.remove();
        longTicket = null;
    }
    const modals = document.querySelectorAll(".result-modal");
    modals.forEach(m => m.remove());
}

function createLongTicket(){
    longTicket = document.createElement("div");
    longTicket.className = "long-ticket";

    const line = document.createElement("div");
    line.className = "ticket-line";
    line.innerText = "🎟 ????";

    longTicket.appendChild(line);
    document.querySelector(".ticket-body").appendChild(longTicket);
}

function extendLongTicket(text){
    if(!longTicket) return;
    if(tapList.length >= 10) return;

    const line = document.createElement("div");
    line.className = "ticket-line";
    line.innerText = "🎟 " + text;

    longTicket.appendChild(line);
}

function getLowReward(){
    const r = Math.random();
    if (r < 0.55){
        return { text:"꽝", coin:0, premium:false };
    } else if (r < 0.80){
        return { text:"음식", coin:0, premium:false };
    } else {
        const cRoll = Math.random();
        const amount = cRoll < 0.7 ? 1 : 2;
        return { text:`엽전+${amount}`, coin:amount, premium:false };
    }
}

/* 확률표 */
function getTicketReward(){
    const roll = Math.random();

    if (roll < 0.40){
        return { text:"꽝", coin:0, premium:false };
    }
    if (roll < 0.55){
        return { text:"음식", coin:0, premium:false };
    }
    if (roll < 0.80){
        const cRoll = Math.random();
        const amount = cRoll < 0.7 ? 1 : 2;
        return { text:`엽전+${amount}`, coin:amount, premium:false };
    }
    if (roll < 0.89){
        const normalPool = [
            "일노","일노","일노",
            "룸노",
            "행노",
            "빂노","빂노"
        ];
        const text = normalPool[Math.floor(Math.random()*normalPool.length)];
        return { text, coin:0, premium:true };
    }
    if (roll < 0.94){
        const rarePool = ["일레","행레","룸레","빂레","빂레"];
        const text = rarePool[Math.floor(Math.random()*rarePool.length)];
        return { text, coin:0, premium:true };
    }
    if (roll < 0.975){
        const spPool = ["랜템","입","멜로디","랜템","입"];
        const text = spPool[Math.floor(Math.random()*spPool.length)];
        return { text, coin:0, premium:true };
    }
    if (roll < 0.995){
        return { text:"일슈", coin:0, premium:true };
    }
    return { text:"빂슈", coin:0, premium:true };
}

/* 티켓 버튼 */
document.getElementById("tapBtn").onclick = () => {
    const now = Date.now();

    if (!tapping) {

        // ▶ 엽전 2개 이상 필요
        if (typeof coins === "number" && coins < 2){
            alert("엽전이 2개 이상 있어야 합니다!");
            return;
        }

        resetTicketSession();

        // ▶ 시작 시 엽전 -2
        if (typeof coins === "number"){
            coins -= 2;
            localStorage.setItem("coins", coins);
            const rpsBox    = document.getElementById("coinBoxRPS");
            const ticketBox = document.getElementById("coinBoxTicket");
            if(rpsBox)    rpsBox.innerText    = `엽전 : ${coins}개`;
            if(ticketBox) ticketBox.innerText = `엽전 : ${coins}개`;
        }

        tapping        = true;
        tapList        = [];
        tapGauge       = 0;
        lastSpawn      = 0;
        tapCountTotal  = 0;
        premiumCount   = 0;

        createLongTicket();
        startGauge();

        setTimeout(()=>{
            if(tapping){
                finishLongTicket();
            }
        }, SESSION_MS);

        return;
    }

    if (tapList.length >= 10) return;

    tapGauge++;
    tapCountTotal++;

    if (tapGauge >= 7 && (now - lastSpawn) > MIN_INTERVAL) {
        lastSpawn = now;
        tapGauge  = 0;

        if (tapList.length < 10) {
            let reward = getTicketReward();

            if (reward.premium){
                const allowThird =
                    (premiumCount === 2 && Math.random() < 0.15);

                if (premiumCount >= 2 && !allowThird){
                    const low = getLowReward();
                    reward = low;
                } else {
                    premiumCount++;
                }
            }

            tapList.push(reward);
            extendLongTicket("????");
        }
    }
};

function finishLongTicket(){
    tapping = false;

    if(gaugeRAF){
        cancelAnimationFrame(gaugeRAF);
        gaugeRAF = null;
    }
    timeArea.style.display = "none";
    timeBar.style.transform = "scaleX(0)";

    const modal = document.createElement("div");
    modal.className = "result-modal";

    const box = document.createElement("div");
    box.className = "result-box";
    box.innerHTML = "<b>🎟 이번에 나온 티켓</b><br><br>";

    let bonusCoins = 0;

    if(tapList.length === 0){
        box.innerHTML += "이번에는 티켓이 안 나왔어요..! 😢<br>";
    } else {
        tapList.forEach((r,i)=>{
            box.innerHTML += `${i+1}) ${r.text}<br>`;
            if (r.coin){
                bonusCoins += r.coin;
            }
        });
    }

    if (bonusCoins > 0){
        coins += bonusCoins;
        localStorage.setItem("coins", coins);
        box.innerHTML += `<br><span style="color:#F7D93A;">엽전 보너스 : +${bonusCoins}개</span><br>`;
    }

    const close = document.createElement("div");
    close.className = "result-close";
    close.innerText = "닫기";

    close.onclick = () => {
        modal.remove();
        if(longTicket){
            longTicket.remove();
            longTicket = null;
        }
        const rpsBox    = document.getElementById("coinBoxRPS");
        const ticketBox = document.getElementById("coinBoxTicket");
        if(rpsBox)    rpsBox.innerText    = `엽전 : ${coins}개`;
        if(ticketBox) ticketBox.innerText = `엽전 : ${coins}개`;
    };

    modal.appendChild(box);
    modal.appendChild(close);
    document.body.appendChild(modal);
}
</script>


<!-- ========================== -->
<!-- ✊ 짱깨뽀 게임 (원판 고정, LED만 회전) -->

<style>
#screen-rps{
    background:url("https://raw.githubusercontent.com/flora385/floraa/main/IMG_9058.jpeg") center/contain no-repeat;
    display:none;
}

/* 중앙 원판 */
.circle-area{
    position:absolute;
    top:24vh;
    left:50%;
    transform:translateX(-50%);
    width:65vw;
    height:65vw;
    border-radius:50%;
    background:radial-gradient(circle,#4f7a7a 0%,#2e4e57 70%);
    border:5px solid #fff;
    box-shadow:0 0 1.2vw rgba(0,0,0,.8),
               inset 0 0 1.2vw rgba(0,0,0,.5);
    display:flex;
    justify-content:center;
    align-items:center;
}

/* 고정 보상 원판 */
.rewards{
    position:relative;
    width:82%;
    height:82%;
    border-radius:50%;
    background:conic-gradient(
        from -90deg,
        #1f7f3c 0deg 45deg,
        #ffffff 45deg 90deg,
        #1f7f3c 90deg 135deg,
        #ffffff 135deg 180deg,
        #1f7f3c 180deg 225deg,
        #ffffff 225deg 270deg,
        #1f7f3c 270deg 315deg,
        #ffffff 315deg 360deg
    );
    border:7px solid #fff;
}

/* 숫자 위치 */
.fix-num{
    position:absolute;
    font-size:5vw;
    font-weight:900;
    color:#ff2c2c;
    text-shadow:
        -0.2vw -0.2vw 0 #fff,
        0.2vw -0.2vw 0 #fff,
        -0.2vw  0.2vw 0 #fff,
        0.2vw  0.2vw 0 #fff,
        0 0 .8vw rgba(0,0,0,.95);
}
.n1{ top:17%; left:60%; transform:translateX(-50%); }
.n2{ top:34%; left:73%; }
.n3{ top:60%; left:76%; transform:translateY(-50%); }
.n4{ top:73%; left:60%; }
.n5{ top:75%; left:40%; transform:translateX(-50%); }
.n6{ top:55%; left:22%; }
.n7{ top:40%; left:20%; transform:translateY(-50%); }
.n8{ top:18%; left:37%; }

/* LED 중앙 */
.led-box{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:42%;
    aspect-ratio:1/1;
    border-radius:50%;
    background:#000;
    box-shadow:inset 0 0 1.4vw rgba(0,0,0,.7),
               0 0 2vw rgba(0,0,0,.7);
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}
.led-icon{
    width:100%;
    height:100%;
    display:flex;
    justify-content:center;
    align-items:center;
}
.led-icon img{
    width:100%;
    height:100%;
    object-fit:contain;
    image-rendering:auto;

    </div>

<script>
/* 공용 코인/응모권 초기화 (자정 리셋) */
function getTodayKey(){
    const d = new Date();
    const m = String(d.getMonth()+1).padStart(2,"0");
    const day = String(d.getDate()).padStart(2,"0");
    return `${d.getFullYear()}-${m}-${day}`;
}

const todayKey = getTodayKey();
const savedDate = localStorage.getItem("coinDate");

if (savedDate !== todayKey){
    localStorage.setItem("coins", 10);
    localStorage.setItem("coinDate", todayKey);
}

let coins   = Number(localStorage.getItem("coins")   || 10);
let coupons = Number(localStorage.getItem("coupons") || 0);

/* 화면에 초기 반영 */
window.addEventListener("load", ()=>{
    const rpsBox    = document.getElementById("coinBoxRPS");
    const ticketBox = document.getElementById("coinBoxTicket");
    if(rpsBox)    rpsBox.innerText    = `엽전 : ${coins}개`;
    if(ticketBox) ticketBox.innerText = `엽전 : ${coins}개`;
});

/* LED 이미지 */
const icons = {
    rock: "https://raw.githubusercontent.com/flora385/floraa/main/F658C9F7-99A3-4C79-9A34-DC9006FFAFD3.png",
    paper: "https://raw.githubusercontent.com/flora385/floraa/main/901A7A3A-C1B2-42B0-BB82-37AF8475D435.png",
    scissors: "https://raw.githubusercontent.com/flora385/floraa/main/4F71DBB1-5807-4162-8DCC-5B36D430F756.png"
};

const ledImg = document.getElementById("ledImg");

/* LED 회전 순서 (원판 고정) */
const seq = ["scissors", "rock", "paper"];

/* 승패 판정 */
function judge(p, m){
    if(p === m) return "draw";
    if(p==="rock" && m==="scissors") return "win";
    if(p==="scissors" && m==="paper") return "win";
    if(p==="paper" && m==="rock") return "win";
    return "lose";
}

/* 랜덤 보상 (이겼을 때만 사용) */
function getRPSreward(){
    const r = Math.random();
    if(r < 0.42) return 2;
    if(r < 0.75) return 4;
    if(r < 0.92) return 1;
    return 7;
}

let spinningR = false;
let currentFace = "rock"; // LED에 마지막으로 들어간 손 모양

/* 엽전 표시 동기화 */
function syncCoins(){
    const rpsBox    = document.getElementById("coinBoxRPS");
    const ticketBox = document.getElementById("coinBoxTicket");
    if(rpsBox)    rpsBox.innerText    = `엽전 : ${coins}개`;
    if(ticketBox) ticketBox.innerText = `엽전 : ${coins}개`;
}

/* 상태 박스 리셋 */
function clearStatusBoxes(){
    const boxes = document.querySelectorAll(".status-box");
    boxes.forEach(b => b.classList.remove("on"));
}

/* RPS 시작 */
function startRPS(player){
    if(spinningR) return;

    if(coins <= 0){
        alert("엽전이 부족합니다!");
        return;
    }

    spinningR = true;
    clearStatusBoxes();

    // 게임 시작 시 엽전 -1
    coins--;
    localStorage.setItem("coins", coins);
    syncCoins();

    let idx = 0;
    let delay = 80;        // 더 빠르게 시작
    let count = 0;
    let maxCount = 17;     // 회전 길이

    function spin(){
        // LED 이미지 교체 (원판은 고정)
        currentFace = seq[idx];
        ledImg.src  = icons[currentFace];

        idx   = (idx + 1) % seq.length;

        delay += 20;       // 점점 느려지는 효과
        count++;

        if(count < maxCount){
            setTimeout(spin, delay);
        } else {
            // 마지막 LED 이미지를 고정 → 결과를 이것으로 판단
            const machine = currentFace;
            finishRPS(player, machine);
        }
    }

    spin();
}

function finishRPS(player, machine){
    // LED 먼저 멈추고 확실히 보여주기
    ledImg.src = icons[machine];

    // 화면에 LED 최종 이미지 확정 표시 후 결과 텍스트
    setTimeout(() => {

        const result = judge(player, machine);
        clearStatusBoxes();

        if(result === "win"){
            const gain = getRPSreward();
            coins += gain;
            localStorage.setItem("coins", coins);
            document.querySelectorAll(".status-box.win").forEach(b=>b.classList.add("on"));
        }
        else if(result === "draw"){
            coins += 1;
            localStorage.setItem("coins", coins);
            document.querySelectorAll(".status-box.draw").forEach(b=>b.classList.add("on"));
        }
        else{
            coins -= 1;
            localStorage.setItem("coins", coins);
            document.querySelectorAll(".status-box.lose").forEach(b=>b.classList.add("on"));
        }

        syncCoins();
        spinningR = false;

    }, 300); 
}
</script>

<script>
function updateCouponPage(){
    document.getElementById("coinCouponNow").innerText = coins;
    document.getElementById("couponCount").innerText = coupons;

    let logs = JSON.parse(localStorage.getItem("couponLogs") || "[]");
    const box = document.getElementById("couponLogsBox");
    box.innerHTML = "<b>교환 기록</b><br><br>";

    logs.slice().reverse().forEach(log=>{
        box.innerHTML += log + "<br>";
    });
}

function exchangeCoupon(){

    // ▶ 엽전 5개 필요
    if(coins < 5){
        alert("엽전이 부족합니다! (5개 필요)");
        return;
    }

    coins -= 5;
    coupons++;

    localStorage.setItem("coins", coins);
    localStorage.setItem("coupons", coupons);

    let logs = JSON.parse(localStorage.getItem("couponLogs") || "[]");
    const now = new Date();
    const stamp = `${now.getFullYear()}/${now.getMonth()+1}/${now.getDate()} `
                 + `${now.getHours()}:${String(now.getMinutes()).padStart(2,"0")}`;
    logs.push(`교환 완료 : ${stamp}`);
    localStorage.setItem("couponLogs", JSON.stringify(logs));

    alert("응모권 1개 획득!");
    updateCouponPage();

    document.getElementById("coinBoxRPS").innerText    = `엽전 : ${coins}개`;
    document.getElementById("coinBoxTicket").innerText = `엽전 : ${coins}개`;
}
</script>

    </div>

    <div id="powerBox">
        <div class="power-wrap">
            <div class="power-line"></div>
            <div class="power-bar" id="powerBar"></div>
        </div>
        <div style="color:white;margin-top:2vh;font-size:3vw;">
            화면을 빠르게 연타하세요!
        </div>
    </div>
</div>

<script>
/* 파워충전 */
let powerOn=false;
let tapCountPower=0;

function startPowerCharge(){

    const today = getTodayKey();
    const last = localStorage.getItem("powerDate");
    let used = Number(localStorage.getItem("powerUsed") || 0);

    if(last===today && used>=3){
        alert("오늘 3회 모두 사용했습니다!");
        return;
    }

    if(last!==today){
        localStorage.setItem("powerUsed",0);
        used=0;
    }

    tapCountPower=0;
    powerOn=true;
    document.getElementById("powerBox").style.display="block";
    alert("⚡ 파워충전 시작!\n빠르게 연타하세요!");

    const bar=document.getElementById("powerBar");
    bar.style.height="0%";

    let duration=3000;
    let start=Date.now();

    function frame(){
        if(!powerOn) return;

        let diff=Date.now()-start;
        let gauge=Math.min(tapCountPower*4,100);
        bar.style.height=gauge+"%";

        if(diff<duration){
            requestAnimationFrame(frame);
        } else finishPowerCharge(gauge);
    }
    frame();
}

document.addEventListener("click", ()=>{
    if(powerOn){
        tapCountPower++;
    }
});

function finishPowerCharge(gauge){
    powerOn=false;
    const bar=document.getElementById("powerBar");

    if(gauge>=20){
        coins+=3;
        localStorage.setItem("coins", coins);
        alert("성공! 엽전 +3 지급!");
    } else {
        alert("실패! 게이지가 부족합니다!");
    }

    const today=getTodayKey();
    let used=Number(localStorage.getItem("powerUsed") || 0);
    localStorage.setItem("powerUsed", used+1);
    localStorage.setItem("powerDate", today);

    document.getElementById("powerBox").style.display="none";
    bar.style.height="0%";

    document.getElementById("coinBoxRPS").innerText    = `엽전 : ${coins}개`;
    document.getElementById("coinBoxTicket").innerText = `엽전 : ${coins}개`;
}
</script>
